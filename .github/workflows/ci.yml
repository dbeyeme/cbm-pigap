name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    name: Lint + tests backend
    runs-on: ubuntu-latest

    # Base vierge pour les tests (ADR-013) ; identifiants propres à la CI, sans valeur secrète.
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: pigap
          POSTGRES_PASSWORD: pigap_ci
          POSTGRES_DB: pigap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pigap -d pigap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://pigap:pigap_ci@localhost:5432/pigap
      TEST_DATABASE_URL: postgresql+asyncpg://pigap:pigap_ci@localhost:5432/pigap_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app

      - name: Black (check)
        run: black --check app

      - name: Pytest
        run: pytest
